# Marker file for the Supabase GitHub integration. Its presence (plus the
# `project_id` below) is what lets Supabase recognize this repository and
# provision a preview branch per pull request.
#
# Alembic — split across `oddish/alembic/` (core) and `backend/alembic/`
# (cloud) — remains the single source of truth for schema changes. The
# `supabase/migrations/` directory is intentionally kept empty so Supabase's
# own migration runner is a no-op on every branch; Alembic is applied from
# `.github/workflows/modal-preview.yml` (previews) and
# `.github/workflows/supabase-db-migrations.yml` (production).

project_id = "lmmlhiospelnvmtjljnn"

# To get prod-data preview branches (the migration-safety mechanism),
# `config.toml` is *not* the right place — Supabase's branching config
# section here only controls seed re-runs on persistent branches, not
# whether ephemeral PR branches clone prod. Two real options:
#
#   1. Flip the Supabase project's GitHub-integration setting that
#      controls data cloning on auto-created branches (dashboard).
#   2. Disable the integration's auto-create and have
#      `.github/workflows/modal-preview.yml` run
#      `supabase branches create "pr-$PR_NUMBER" --with-data --project-ref ...`
#      itself. `wait_for_supabase_branch.sh` already polls by name.
#
# Pick one before the bootstrap step is meaningful as a migration-
# safety check.
