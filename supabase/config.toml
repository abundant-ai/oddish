# Marker file for the Supabase GitHub integration. Its presence (plus the
# `project_id` below) is what lets Supabase recognize this repository and
# provision a preview branch per pull request.
#
# Alembic — split across `oddish/alembic/` (core) and `backend/alembic/`
# (cloud) — remains the single source of truth for schema changes. The
# `supabase/migrations/` directory is intentionally kept empty so Supabase's
# own migration runner is a no-op on every branch; Alembic is applied from
# `.github/workflows/modal-preview.yml` (previews) and
# `.github/workflows/supabase-db-migrations.yml` (production).

project_id = "lmmlhiospelnvmtjljnn"

# Clone production data into every PR preview branch.
#
# This is the migration-safety lever: with prod data present, an unsafe
# Alembic revision (NOT NULL on a column with nulls, dropped column with
# rows referencing it, FK cycle, etc.) breaks the bootstrap step in CI
# instead of breaking prod after merge.
#
# Equivalent to passing `--with-data` to `supabase branches create` (see
# https://supabase.com/docs/reference/cli/supabase-branches-create).
#
# If the GitHub integration on the project hasn't picked up this flag
# from `config.toml` yet, set the same flag in the Supabase dashboard
# (Branching → Settings → "Clone production data") so existing/future
# auto-created branches honor it.
[experimental.branching]
with_data = true
