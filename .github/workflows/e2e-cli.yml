name: "E2E: CLI smoke"

# Two independent pytest suites on separate runners. They share no database
# state and used to run back-to-back in one job after a single uv sync.
#
# `e2e` runs the opt-in end-to-end CLI suite (backend/tests/e2e) against a real
# uvicorn server, the real oddish CLI subprocess, and a real Postgres. This is
# the repo's only pytest job that boots a socket and exercises the CLI; the
# ASGITransport unit tests never do. See docs/e2e-test-plan.md for coverage.
#
# `delivery` runs the delivery-page and approval-rule unit/integration tests.
#
# Both jobs run directly on ubuntu-latest (NOT in a job container) on purpose:
# the e2e conftest hard-refuses any non-localhost DB host, and a job container
# would reach the postgres service under the hostname `postgres`, tripping that
# guard. With the service ports mapped to the host, the DB is reachable at
# 127.0.0.1:5432 and the localhost guard stays intact.

on:
  pull_request:
    paths:
      - "backend/**"
      - "oddish/src/**"
      - "oddish/tests/startup/**"
      - "oddish/tests/test_config_queue_keys.py"
      - "oddish/tests/test_deliver*"
      - "oddish/pyproject.toml"
      - "oddish/uv.lock"
      - ".github/workflows/e2e-cli.yml"
  push:
    branches:
      - main
      - staging
    paths:
      - "backend/**"
      - "oddish/src/**"
      - "oddish/tests/startup/**"
      - "oddish/tests/test_config_queue_keys.py"
      - "oddish/tests/test_deliver*"
      - "oddish/pyproject.toml"
      - "oddish/uv.lock"
      - ".github/workflows/e2e-cli.yml"

concurrency:
  group: e2e-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: "oddish run → queued trial"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oddish
          POSTGRES_PASSWORD: oddish
          POSTGRES_DB: oddish
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U oddish -d oddish"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Sync backend dependencies
        run: uv sync --frozen

      - name: Check CLI startup latency and model routing
        run: >-
          uv run pytest
          ../oddish/tests/startup
          ../oddish/tests/test_config_queue_keys.py -v

      - name: Run e2e CLI suite
        env:
          ODDISH_E2E: "1"
          ODDISH_DATABASE_URL: postgresql+asyncpg://oddish:oddish@127.0.0.1:5432/oddish
        run: uv run pytest tests/e2e -v

  delivery:
    name: "delivery pages and approval rules"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oddish
          POSTGRES_PASSWORD: oddish
          POSTGRES_DB: oddish
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U oddish -d oddish"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Sync backend dependencies
        run: uv sync --frozen

      - name: Check delivery pages and approval rules
        env:
          ODDISH_DATABASE_URL: postgresql+asyncpg://oddish:oddish@127.0.0.1:5432/oddish
        run: >-
          uv run pytest
          ../oddish/tests/test_deliveries.py
          ../oddish/tests/test_delivery_view.py
          ../oddish/tests/test_delivery_qa.py
          ../oddish/tests/test_delivery_progress.py
          ../oddish/tests/test_delivery_inventory.py
          ../oddish/tests/test_task_history_schema.py
          ../oddish/tests/test_delivery_apply.py
          ../oddish/tests/test_delivery_history_api.py
          ../oddish/tests/test_cli_delivery_history.py
          tests/test_deliveries_routes.py
          tests/test_delivery_page_routes.py -q
