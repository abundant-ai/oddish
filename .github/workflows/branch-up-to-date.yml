name: Branch up to date

# Fails a PR whose branch does not contain the current tip of its base branch.
# The other PR workflows call this file via workflow_call and `needs:` the
# up-to-date job, so a stale branch can't turn any PR check green; adding "Up
# to date with base" to the main ruleset binds the merge button directly.
#
# One compare API call (behind_by == 0) instead of a checkout: an ancestry
# test needs full history, and the default pull_request checkout is the merge
# ref — the branch already merged with main, whose tip is therefore always an
# ancestor — so a checkout-based version could never fail.
#
# The step is scoped to pull_request so callers' push / workflow_dispatch /
# merge_group runs pass trivially. No concurrency group: several callers run
# this at once, and a shared group would let their gate jobs cancel each other.

on:
  pull_request:
  workflow_call:

jobs:
  up-to-date:
    name: Up to date with base
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require branch to contain the latest base commit
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          compare="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_REF//\//%2F}...${HEAD_SHA}")"
          behind="$(jq -r '.behind_by' <<<"$compare")"
          base_tip="$(jq -r '.base_commit.sha' <<<"$compare")"
          echo "Latest ${BASE_REF} commit: ${base_tip}"
          echo "PR branch head:           ${HEAD_SHA}"
          if [ "$behind" -eq 0 ]; then
            echo "Branch already contains the latest ${BASE_REF} commit."
            exit 0
          fi
          echo "::error::Branch is ${behind} commit(s) behind ${BASE_REF}. PR checks are blocked until it catches up:"
          echo "::error::  git fetch origin ${BASE_REF} && git merge origin/${BASE_REF}   (or rebase instead of merge)"
          exit 1
