name: Prompt Eval

# Golden-based regression evals for the QA prompt files. Fires only when a PR
# touches a prompt file (or the golden corpus), evaluates only the changed
# prompts — merge-base version vs PR version, across the agents configured in
# evals/prompt-goldens/config.yaml — and posts the comparison as one sticky PR
# comment. Harness: oddish/src/oddish/evals/prompt_eval; corpus format:
# evals/prompt-goldens/README.md.
#
# Requires an Anthropic credential secret (CLAUDE_CODE_OAUTH_TOKEN and/or
# ANTHROPIC_API_KEY) — the eval drives the real Claude CLI classifier. The job
# is informational: it never fails the PR on a score regression, the comment
# is the deliverable.

on:
  pull_request:
    paths:
      - "oddish/src/oddish/analyze/classify_prompt.txt"
      - "oddish/src/oddish/analyze/verdict_prompt.txt"
      - "oddish/src/oddish/analyze/prompts/pre_trial_qa.txt"
      - "oddish/src/oddish/analyze/prompts/trajectory_summary.txt"
      - "evals/prompt-goldens/**"
      - "oddish/src/oddish/evals/prompt_eval/**"
      - ".github/workflows/prompt-eval.yml"

concurrency:
  group: prompt-eval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  prompt-eval:
    name: "Changed prompts vs goldens"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Secrets are unavailable to forks; skip rather than fail there.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Sync oddish dependencies
        working-directory: oddish
        # server extra: the classifier's CLI client imports oddish.db models.
        run: uv sync --frozen --extra server

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run prompt evals
        working-directory: oddish
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          echo "Comparing against merge-base $BASE_SHA"
          uv run python -m oddish.evals.prompt_eval ci \
            --repo-root .. \
            --base-sha "$BASE_SHA" \
            --out-dir "$RUNNER_TEMP/prompt-eval" \
            --comment-file "$RUNNER_TEMP/prompt-eval/comment.md"

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-eval-results
          path: ${{ runner.temp }}/prompt-eval
          if-no-files-found: ignore

      - name: Post sticky PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.RUNNER_TEMP}/prompt-eval/comment.md`;
            if (!fs.existsSync(path)) {
              core.info('No comment file produced; nothing eval-able changed.');
              return;
            }
            const body = fs.readFileSync(path, 'utf8');
            const marker = '<!-- oddish-prompt-eval -->';
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
