name: Publish Oddish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v7

      - name: Build distributions
        run: uv build --project oddish

      - name: Check distributions
        run: uvx twine check oddish/dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: oddish-distributions
          path: oddish/dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/oddish
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: oddish-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
