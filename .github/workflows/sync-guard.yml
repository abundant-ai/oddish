name: Branch Sync Guard
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Assert main is an ancestor of staging
        run: |
          set -euo pipefail
          git fetch origin main staging
          git merge-base --is-ancestor origin/main origin/staging \
            || { echo "::error::main has commits not on staging — FF invariant broken. Recovery: a maintainer with push access force-realigns with 'git push --force origin origin/staging:main' (content-identical)."; exit 1; }
          echo "invariant holds"
