name: Branch Sync Guard
on:
  # Divergence can only be created by a commit landing on main, so check
  # exactly then: immediate signal, silent otherwise. The daily run is a
  # backstop for the window where this file is not yet on main (a push
  # trigger only fires for a workflow that exists on the pushed branch).
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Assert main is an ancestor of staging
        run: |
          set -euo pipefail
          git fetch origin main staging
          git merge-base --is-ancestor origin/main origin/staging \
            || { echo "::error::main has commits not on staging — FF invariant broken. Recovery: rebuild staging on main so main-only commits survive — run the Sync Preflight workflow for the exact commands. Never force-push main."; exit 1; }
          echo "invariant holds"
