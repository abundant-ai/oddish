name: Modal Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: modal-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: main
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync backend dependencies
        run: uv sync --frozen

      - name: Deploy Modal backend
        run: uv run modal deploy deploy.py

      - name: Smoke test deployed API
        # `modal deploy` exiting 0 isn't enough — it can succeed while
        # leaving cold-starts broken (function references a Modal secret
        # that doesn't exist; warm containers keep serving but new ones
        # crash). The /public/experiments/{token}/tasks call exercises
        # the ORM cascade that today's schema-drift incident broke, so a
        # 200 here proves: ASGI alive + DB reachable + schema matches.
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          sleep 10
          URL=https://abundant-ai--api.modal.run
          token=$(curl -fsS -m 10 "$URL/public/experiments?limit=1" | jq -r '.[0].public_token // ""')
          [ -z "$token" ] || curl -fsS -m 30 "$URL/public/experiments/$token/tasks?limit=1" >/dev/null

      - name: Summarize deployment
        run: |
          {
            echo "## Modal deployment"
            echo
            echo "- Backend entrypoint: \`backend/deploy.py\`"
            echo "- Modal environment: \`main\`"
            echo "- Trigger: push to \`main\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
