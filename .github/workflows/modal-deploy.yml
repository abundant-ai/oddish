name: Production Deploy

# One pipeline, strictly ordered: database migrations, then the Modal backend,
# then the Vercel frontend. These used to be three independent triggers on the
# same push (this file, supabase-db-migrations.yml, and Vercel's git
# integration), which raced: a backend requiring a new column could go live
# while the migration adding it was still running (a real production migration
# took ~21 minutes; the Modal deploy takes ~3), and a new frontend could reach
# the old backend with requests it misreads (an experiment-scoped cancel hits
# a backend that ignores the scope and cancels the whole task). Schema first,
# then the code that needs it, then the UI that talks to it.
#
# Vercel's git deploys for main are disabled in frontend/vercel.json; the
# frontend job below creates the production deployment through the Vercel API
# instead, pinned to this exact commit, once the backend is live.
#
# The filename stays modal-deploy.yml even though the workflow outgrew the
# name: backend/tests/test_ec2_secret_topology.py reads this file by name.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

# cancel-in-progress: false, unlike the old modal-deploy-main group: a
# superseding push must never cancel a half-applied migration. GitHub keeps
# one run pending per group, so the newest push still supersedes anything
# queued behind the running one.
concurrency:
  group: production-environment
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate database, deploy backend
    # workflow_dispatch can be pointed at any ref; only main may reach
    # production. Skipping here also skips the frontend job via needs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Covers a long migration (the ~21-minute precedent) plus the deploy;
    # the old migration workflow's 20-minute timeout sat under that precedent.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    # Python 3.13, uv, and a warm uv cache live in the base image —
    # refreshed weekly by .github/workflows/ci-base-image.yml.
    container:
      image: ghcr.io/abundant-ai/oddish-ci-base:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: main
      # Hold LLM trials until a task's nop/oracle baselines validate it.
      ODDISH_GATE_LLM_ON_BASELINES: "1"
      # Enable the GKE (TPU) execution backend in prod. The SA credential
      # rides in the oddish-gcp secret (attached when ODDISH_GKE_ENABLED is
      # set); the non-secret cluster/registry coordinates are declared here
      # so the backend registers deterministically -- even if oddish-gcp is
      # ever re-created with only the key (which silently un-registered GKE
      # once, since gke_cluster_name failed to derive without a project id).
      ODDISH_GKE_ENABLED: "true"
      ODDISH_GKE_PROJECT_ID: "abundant-default"
      ODDISH_GKE_REGION: "us-east5"
      ODDISH_GKE_REGISTRY_LOCATION: "us-east5"
      ODDISH_GKE_REGISTRY_NAME: "oddish-envs"
      ODDISH_GKE_AUTO_PROVISION_CLUSTER: "true"
      ODDISH_GKE_AUTO_BUILD_MISSING_IMAGE: "true"
      ODDISH_GKE_IDLE_CLUSTER_TTL_HOURS: "1"
      # Ephemeral Harbor CPU sandboxes. Credentials and the SSH private key are
      # attached from dedicated Modal secrets; only platform-owned launch
      # coordinates are declared in the deployment environment.
      ODDISH_EC2_ENABLED: "true"
      ODDISH_EC2_CONTROL_SECRET_NAME: oddish-ec2-control
      ODDISH_EC2_SSH_SECRET_NAME: oddish-ec2-ssh
      ODDISH_EC2_REGION: us-west-2
      ODDISH_EC2_AMI_ID: ami-0ac74609c6396bed3
      ODDISH_EC2_INSTANCE_TYPE: m7i-flex.2xlarge
      ODDISH_EC2_SUBNET_ID: subnet-0da0349bc81aa34d8
      ODDISH_EC2_SECURITY_GROUP_IDS: '["sg-04d0011ae0f6b6c00"]'
      ODDISH_EC2_KEY_NAME: oddish-harbor
      ODDISH_EC2_SSH_USER: ubuntu
      ODDISH_EC2_ROOT_VOLUME_SIZE_GB: "80"
      ODDISH_EC2_USE_PUBLIC_IP: "true"
      ODDISH_EC2_BOOTSTRAP_DOCKER: "true"
      # Point uv at the .venv pre-built into the base image.  `uv sync
      # --frozen` then validates that venv against the current lockfile
      # and only patches the editable oddish path — typically a no-op
      # taking ~1s.
      UV_PROJECT_ENVIRONMENT: /opt/venvs/backend
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate production Supabase URL is configured
        env:
          ODDISH_DATABASE_URL: ${{ secrets.ODDISH_DATABASE_URL }}
        run: |
          if [ -z "${ODDISH_DATABASE_URL}" ]; then
            echo "Missing GitHub secret: ODDISH_DATABASE_URL" >&2
            exit 1
          fi

      # ODDISH_DATABASE_URL stays step-scoped, never job-level:
      # backend/modal_app.py bakes selected deploy-time env vars into the
      # image (fixed keys, the ODDISH_GKE_ prefix, an EC2 allowlist), so a
      # job-level database credential would sit one filter widening away
      # from shipping inside the image. Mirrors staging-deploy.yml.
      - name: Core migrations
        working-directory: oddish
        env:
          UV_PROJECT_ENVIRONMENT: /opt/venvs/oddish
          ODDISH_DATABASE_URL: ${{ secrets.ODDISH_DATABASE_URL }}
        run: |
          uv sync --frozen --extra server
          uv run alembic upgrade head

      - name: Backend migrations
        env:
          ODDISH_DATABASE_URL: ${{ secrets.ODDISH_DATABASE_URL }}
        run: |
          uv sync --frozen
          uv run alembic upgrade head

      - name: Deploy Modal backend
        run: |
          uv sync --frozen
          uv run modal deploy deploy.py

      - name: Summarize deployment
        if: ${{ always() }}
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- Core migrations: \`oddish/alembic\` · Cloud: \`backend/alembic\`"
            echo "- Backend entrypoint: \`backend/deploy.py\` (Modal environment \`main\`)"
            echo "- Frontend: Vercel production deploy runs as the next job"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Deploy frontend
    # Ordered after the backend so a new frontend never talks to the old
    # backend. Skipped automatically when `deploy` fails or is skipped.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_GIT_BRANCH: main
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Deploy frontend to Vercel
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/production/deploy_vercel.py"
