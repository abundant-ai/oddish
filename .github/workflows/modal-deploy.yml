name: Modal Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: modal-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Python 3.13, uv, and a warm uv cache live in the base image —
    # refreshed weekly by .github/workflows/ci-base-image.yml.
    container:
      image: ghcr.io/abundant-ai/oddish-ci-base:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: main
      # Subscription eval enablement (cyber 206-task run, PR #308). The cs-creds
      # secret (personal Claude OAuth token + codex auth.json) is mounted ONLY on
      # the trial worker (backend/modal_app.py:worker_secrets), never the API or
      # dispatcher. Routing is opt-in per-trial via the `sub/<model>` prefix, so
      # default prod agents are unaffected. The claude-code `sub/` bucket is
      # capped (overrides below) so it can't run 48-wide against a single Claude
      # Max account.
      ODDISH_EXTRA_SECRET_NAME: cs-creds
      ODDISH_MODEL_CONCURRENCY_OVERRIDES: '{"google/gemini-3.5-flash": 128, "global.anthropic.claude-haiku-4-5-20251001-v1:0": 128, "openai/gpt-5.4-mini": 128, "sub/claude-opus-4-8": 4}'
      # Point uv at the .venv pre-built into the base image.  `uv sync
      # --frozen` then validates that venv against the current lockfile
      # and only patches the editable oddish path — typically a no-op
      # taking ~1s.
      UV_PROJECT_ENVIRONMENT: /opt/venvs/backend
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Sync backend dependencies
        run: uv sync --frozen

      - name: Deploy Modal backend
        run: uv run modal deploy deploy.py

      - name: Summarize deployment
        run: |
          {
            echo "## Modal deployment"
            echo
            echo "- Backend entrypoint: \`backend/deploy.py\`"
            echo "- Modal environment: \`main\`"
            echo "- Trigger: push to \`main\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
