name: Modal Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: modal-deploy-main
  # Not cancel-in-progress: this workflow now owns migrations, and cancelling
  # mid-run can interrupt an autocommit_block statement (CREATE INDEX
  # CONCURRENTLY, ALTER TYPE ... ADD VALUE) that sits outside alembic's
  # transaction, leaving the schema half-applied. Queue instead.
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    # Python 3.13, uv, and a warm uv cache live in the base image —
    # refreshed weekly by .github/workflows/ci-base-image.yml.
    container:
      image: ghcr.io/abundant-ai/oddish-ci-base:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      ODDISH_DATABASE_URL: ${{ secrets.ODDISH_DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate production Supabase URL is configured
        run: |
          if [ -z "${ODDISH_DATABASE_URL}" ]; then
            echo "Missing GitHub secret: ODDISH_DATABASE_URL" >&2
            exit 1
          fi

      # UV_PROJECT_ENVIRONMENT points uv at the per-project .venv that was
      # pre-built into the base image; `uv sync --frozen` then only needs
      # to patch the editable install paths against the CI checkout.
      - name: Sync oddish dependencies
        working-directory: oddish
        env:
          UV_PROJECT_ENVIRONMENT: /opt/venvs/oddish
        run: uv sync --frozen --extra server

      - name: Run oddish migrations
        working-directory: oddish
        env:
          UV_PROJECT_ENVIRONMENT: /opt/venvs/oddish
        run: uv run alembic upgrade head

      - name: Sync backend dependencies
        working-directory: backend
        env:
          UV_PROJECT_ENVIRONMENT: /opt/venvs/backend
        run: uv sync --frozen

      - name: Run backend migrations
        working-directory: backend
        env:
          UV_PROJECT_ENVIRONMENT: /opt/venvs/backend
        run: uv run alembic upgrade head

      - name: Summarize migration run
        if: ${{ always() }}
        run: |
          {
            echo "## Supabase DB migrations"
            echo
            echo "- Database: production Supabase via \`ODDISH_DATABASE_URL\`"
            echo "- Core migrations: \`oddish/alembic\`"
            echo "- Cloud migrations: \`backend/alembic\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [migrate]
    # Migrations must land before code: taskreg_004 adds a value to a native
    # Postgres enum, so old schema + new code 500s. Rolling code back instead
    # keeps the schema, but old code reading a `DERIVED` row raises LookupError
    # -- migrations must strictly precede deploy in both directions.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Python 3.13, uv, and a warm uv cache live in the base image —
    # refreshed weekly by .github/workflows/ci-base-image.yml.
    container:
      image: ghcr.io/abundant-ai/oddish-ci-base:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: main
      # Hold LLM trials until a task's nop/oracle baselines validate it.
      ODDISH_GATE_LLM_ON_BASELINES: "1"
      # Enable the GKE (TPU) execution backend in prod. The SA credential
      # rides in the oddish-gcp secret (attached when ODDISH_GKE_ENABLED is
      # set); the non-secret cluster/registry coordinates are declared here
      # so the backend registers deterministically -- even if oddish-gcp is
      # ever re-created with only the key (which silently un-registered GKE
      # once, since gke_cluster_name failed to derive without a project id).
      ODDISH_GKE_ENABLED: "true"
      ODDISH_GKE_PROJECT_ID: "abundant-default"
      ODDISH_GKE_REGION: "us-east5"
      ODDISH_GKE_REGISTRY_LOCATION: "us-east5"
      ODDISH_GKE_REGISTRY_NAME: "oddish-envs"
      ODDISH_GKE_AUTO_PROVISION_CLUSTER: "true"
      ODDISH_GKE_AUTO_BUILD_MISSING_IMAGE: "true"
      ODDISH_GKE_IDLE_CLUSTER_TTL_HOURS: "1"
      # Point uv at the .venv pre-built into the base image.  `uv sync
      # --frozen` then validates that venv against the current lockfile
      # and only patches the editable oddish path — typically a no-op
      # taking ~1s.
      UV_PROJECT_ENVIRONMENT: /opt/venvs/backend
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Sync backend dependencies
        run: uv sync --frozen

      - name: Deploy Modal backend
        run: uv run modal deploy deploy.py

      - name: Summarize deployment
        run: |
          {
            echo "## Modal deployment"
            echo
            echo "- Backend entrypoint: \`backend/deploy.py\`"
            echo "- Modal environment: \`main\`"
            echo "- Trigger: push to \`main\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
