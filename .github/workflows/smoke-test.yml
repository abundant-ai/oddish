name: Smoke Test

on:
  schedule:
    # Hourly at :13 to avoid the :00 thundering herd shared with most other crons.
    - cron: "13 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Liveness probe
        run: |
          set -euo pipefail
          curl --fail --show-error --max-time 10 \
               "${{ secrets.ODDISH_PROD_URL }}/health"
