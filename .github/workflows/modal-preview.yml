name: Modal Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: modal-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-changes:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      deploy_backend: ${{ steps.compute.outputs.deploy_backend }}
      run_migrations: ${{ steps.compute.outputs.run_migrations }}
      any_change: ${{ steps.compute.outputs.any_change }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # For each component (backend, migrations) we find the most recent
      # workflow run on this PR branch whose corresponding step finished
      # with conclusion=success, and use that run's head_sha as the diff
      # base. If a prior push failed mid-deploy, its broken state is not
      # recorded as a successful base, so the next push will still
      # redeploy the affected component.
      - name: Look up last-successful component SHAs
        id: last_deployed
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          python <<'PY'
          import json
          import os
          import subprocess

          owner_repo = os.environ["OWNER_REPO"]
          head_ref = os.environ["HEAD_REF"]
          workflow_file = "modal-preview.yml"

          # Step name -> output key. We only look at steps inside the
          # deploy-preview job.
          STEPS_BY_COMPONENT = {
              "Deploy preview backend": "backend_base",
              "Apply Alembic migrations to preview branch": "migrations_base",
          }

          def gh_api(path):
              result = subprocess.run(
                  ["gh", "api", "-H", "Accept: application/vnd.github+json", path],
                  capture_output=True, text=True, check=True,
              )
              return json.loads(result.stdout)

          runs = gh_api(
              f"/repos/{owner_repo}/actions/workflows/{workflow_file}/runs"
              f"?branch={head_ref}&event=pull_request&per_page=30"
          ).get("workflow_runs", [])

          found = {}
          for run in runs:
              if len(found) == len(STEPS_BY_COMPONENT):
                  break
              run_id = run["id"]
              sha = run["head_sha"]
              jobs = gh_api(
                  f"/repos/{owner_repo}/actions/runs/{run_id}/jobs?per_page=100"
              ).get("jobs", [])
              for job in jobs:
                  if job.get("name") != "deploy-preview":
                      continue
                  for step in job.get("steps", []) or []:
                      if step.get("conclusion") != "success":
                          continue
                      key = STEPS_BY_COMPONENT.get(step.get("name"))
                      if key and key not in found:
                          found[key] = sha

          out_path = os.environ["GITHUB_OUTPUT"]
          with open(out_path, "a") as f:
              for key in STEPS_BY_COMPONENT.values():
                  f.write(f"{key}={found.get(key, '')}\n")
          PY

      - name: Detect backend code changes since last successful backend deploy
        id: filter_backend
        if: github.event.action == 'synchronize' && steps.last_deployed.outputs.backend_base != ''
        uses: dorny/paths-filter@v3
        with:
          base: ${{ steps.last_deployed.outputs.backend_base }}
          ref: ${{ github.event.pull_request.head.sha }}
          filters: |
            changed:
              - 'backend/**'
              - '!backend/alembic/**'
              - '!backend/**/*.md'
              - 'oddish/**'
              - '!oddish/alembic/**'
              - '!oddish/**/*.md'

      - name: Detect migration changes since last successful migration run
        id: filter_migrations
        if: github.event.action == 'synchronize' && steps.last_deployed.outputs.migrations_base != ''
        uses: dorny/paths-filter@v3
        with:
          base: ${{ steps.last_deployed.outputs.migrations_base }}
          ref: ${{ github.event.pull_request.head.sha }}
          filters: |
            changed:
              - 'backend/alembic/**'
              - 'oddish/alembic/**'

      # Workflow / script changes are diffed against the previous push,
      # not a per-component base, because they can affect any component.
      - name: Detect workflow or preview-script changes since previous push
        id: filter_workflow
        if: github.event.action == 'synchronize'
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.event.pull_request.head.sha }}
          filters: |
            changed:
              - '.github/workflows/modal-preview.yml'
              - '.github/scripts/preview/**'

      - name: Compute deployment plan
        id: compute
        env:
          EVENT_ACTION: ${{ github.event.action }}
          BACKEND_BASE: ${{ steps.last_deployed.outputs.backend_base }}
          MIGRATIONS_BASE: ${{ steps.last_deployed.outputs.migrations_base }}
          BACKEND_CHANGED: ${{ steps.filter_backend.outputs.changed }}
          MIGRATIONS_CHANGED: ${{ steps.filter_migrations.outputs.changed }}
          WORKFLOW_CHANGED: ${{ steps.filter_workflow.outputs.changed }}
        run: |
          set -euo pipefail
          deploy_backend=false
          run_migrations=false

          if [ "$EVENT_ACTION" != "synchronize" ] || [ "$WORKFLOW_CHANGED" = "true" ]; then
            deploy_backend=true
            run_migrations=true
          else
            # No prior successful deploy on this branch -> deploy now.
            if [ -z "$BACKEND_BASE" ] || [ "$BACKEND_CHANGED" = "true" ]; then
              deploy_backend=true
            fi
            if [ -z "$MIGRATIONS_BASE" ] || [ "$MIGRATIONS_CHANGED" = "true" ]; then
              run_migrations=true
            fi
            # New migrations imply schema change -> backend must redeploy.
            if [ "$run_migrations" = "true" ]; then
              deploy_backend=true
            fi
          fi

          any_change=false
          if [ "$deploy_backend" = "true" ] || [ "$run_migrations" = "true" ]; then
            any_change=true
          fi

          {
            echo "deploy_backend=$deploy_backend"
            echo "run_migrations=$run_migrations"
            echo "any_change=$any_change"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Preview deployment plan"
            echo
            echo "- Event action: \`$EVENT_ACTION\`"
            echo "- Last successful backend deploy: \`${BACKEND_BASE:-(none)}\`"
            echo "- Last successful migration run: \`${MIGRATIONS_BASE:-(none)}\`"
            echo "- Backend code changed since: \`${BACKEND_CHANGED:-n/a}\`"
            echo "- Migrations changed since: \`${MIGRATIONS_CHANGED:-n/a}\`"
            echo "- Workflow/scripts changed since previous push: \`${WORKFLOW_CHANGED:-n/a}\`"
            echo "- Plan: deploy_backend=\`$deploy_backend\` run_migrations=\`$run_migrations\` any_change=\`$any_change\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-preview:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_change == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: preview
      MODAL_APP_NAME: oddish-pr-${{ github.event.pull_request.number }}
      MODAL_SECRET_ENVIRONMENT: main
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_GIT_BRANCH: ${{ github.event.pull_request.head.ref }}
      VERCEL_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      ODDISH_MODAL_API_MIN_CONTAINERS: "0"
      ODDISH_MODAL_API_BUFFER_CONTAINERS: "0"
      ODDISH_MODAL_API_MAX_CONTAINERS: "2"
      ODDISH_MODAL_WORKER_MIN_CONTAINERS: "0"
      ODDISH_MODAL_WORKER_BUFFER_CONTAINERS: "0"
      ODDISH_MODAL_WORKER_MAX_CONTAINERS: "2"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ensure Supabase preview branch with prod data
        id: supabase_branch
        working-directory: ${{ github.workspace }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/preview/wait_for_supabase_branch.sh

      - name: Sync backend dependencies
        run: uv sync --frozen

      - name: Apply Alembic migrations to preview branch
        if: ${{ needs.detect-changes.outputs.run_migrations == 'true' || steps.supabase_branch.outputs.branch_was_created == 'true' }}
        run: uv run python "$GITHUB_WORKSPACE/.github/scripts/preview/bootstrap_preview_db.py"

      - name: Cancel cloned-prod in-flight work
        # Only on a fresh branch — once the dev has interacted with the
        # preview, their own pending work shouldn't get nuked on every
        # subsequent push.
        if: steps.supabase_branch.outputs.branch_was_created == 'true'
        run: |
          psql "${ODDISH_DATABASE_URL/+asyncpg/}" <<'SQL'
          UPDATE worker_jobs
             SET status = 'CANCELLED'
           WHERE status IN ('QUEUED', 'RUNNING', 'RETRYING', 'BLOCKED');
          UPDATE tasks
             SET status = 'failed'
           WHERE status IN ('pending', 'running', 'analyzing', 'verdict_pending');
          UPDATE trials
             SET status = 'failed'
           WHERE status IN ('pending', 'queued', 'running', 'retrying');
          SQL

      - name: Create per-PR Modal database secret
        if: ${{ needs.detect-changes.outputs.deploy_backend == 'true' || steps.supabase_branch.outputs.branch_was_created == 'true' }}
        run: |
          uv run modal secret create \
            --env "$MODAL_ENVIRONMENT" --force \
            "$MODAL_APP_NAME-db" \
            "ODDISH_DATABASE_URL=$ODDISH_DATABASE_URL"

      - name: Deploy preview backend
        id: deploy_modal
        if: ${{ needs.detect-changes.outputs.deploy_backend == 'true' || steps.supabase_branch.outputs.branch_was_created == 'true' }}
        run: |
          deploy_log="$(mktemp)"
          uv run modal deploy deploy.py 2>&1 | tee "$deploy_log"
          modal_api_url="$(python - "$deploy_log" "$MODAL_APP_NAME" <<'PY'
          import pathlib
          import re
          import sys

          log_path = pathlib.Path(sys.argv[1])
          app_name = sys.argv[2]
          text = log_path.read_text()

          candidates = []
          for line in text.splitlines():
              if "modal.run" not in line:
                  continue
              if "api" not in line.lower():
                  continue
              match = re.search(r"https://[^\s]+\.modal\.run", line)
              if match:
                  candidates.append(match.group(0))

          if not candidates:
              raise SystemExit(
                  f"Could not determine Modal API URL for {app_name} from deploy output"
              )
          print(candidates[-1])
          PY
          )"
          echo "modal_api_url=$modal_api_url" >> "$GITHUB_OUTPUT"

      - name: Wait for preview backend readiness
        id: readiness
        if: ${{ steps.deploy_modal.outcome == 'success' }}
        run: |
          python - "${{ steps.deploy_modal.outputs.modal_api_url }}" <<'PY'
          import sys
          import time
          import urllib.error
          import urllib.request

          base_url = sys.argv[1].rstrip("/")
          readiness_url = f"{base_url}/openapi.json"
          deadline = time.time() + 180
          last_error = "no readiness response yet"

          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(readiness_url, timeout=10) as response:
                      payload = response.read(64)
                  if response.status == 200 and payload:
                      print(f"Modal preview ready at {readiness_url}")
                      break
                  last_error = f"unexpected response: {payload!r}"
              except urllib.error.HTTPError as exc:
                  last_error = f"http {exc.code}"
              except Exception as exc:  # noqa: BLE001
                  last_error = str(exc)
              time.sleep(5)
          else:
              raise SystemExit(
                  f"Modal preview never became ready at {readiness_url}: {last_error}"
              )
          PY

      - name: Dump Modal preview logs on readiness failure
        if: ${{ failure() && steps.readiness.conclusion == 'failure' }}
        continue-on-error: true
        # `modal app logs` streams forever; bound it. `--env` is needed
        # because the CLI ignores MODAL_ENVIRONMENT for this subcommand.
        run: timeout --preserve-status 45s uv run modal app logs --env "$MODAL_ENVIRONMENT" --timestamps "$MODAL_APP_NAME" 2>&1 | tail -300 || true

      # Vercel setup runs only on the first deploy (newly-created Supabase
      # branch). MODAL_APP_NAME is keyed on the PR number, so the Modal URL
      # is stable across subsequent pushes — Vercel's GitHub integration
      # auto-deploys those with the already-set NEXT_PUBLIC_API_URL.
      - name: Install Node
        if: ${{ steps.supabase_branch.outputs.branch_was_created == 'true' && env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        if: ${{ steps.supabase_branch.outputs.branch_was_created == 'true' && env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: npm install --global vercel@latest

      - name: Link Vercel project
        if: ${{ steps.supabase_branch.outputs.branch_was_created == 'true' && env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        run: vercel pull --yes --environment=preview --git-branch="$VERCEL_GIT_BRANCH" --token="$VERCEL_TOKEN"

      - name: Point Vercel preview to Modal preview
        if: ${{ steps.supabase_branch.outputs.branch_was_created == 'true' && env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        env:
          MODAL_API_URL: ${{ steps.deploy_modal.outputs.modal_api_url }}
        # NEXT_PUBLIC_API_URL is the only backend URL the frontend reads
        # (frontend/src/lib/backend-config.ts). --no-sensitive keeps it
        # visible in the dashboard for debugging.
        run: printf '%s' "$MODAL_API_URL" | vercel env add NEXT_PUBLIC_API_URL preview "$VERCEL_GIT_BRANCH" --force --no-sensitive --token="$VERCEL_TOKEN"

      - name: Redeploy Vercel preview with updated env
        id: redeploy_vercel
        if: ${{ steps.supabase_branch.outputs.branch_was_created == 'true' && env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        run: |
          deployment_json="$(python <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          token = os.environ["VERCEL_TOKEN"]
          project_id = os.environ["VERCEL_PROJECT_ID"]
          team_id = os.environ["VERCEL_ORG_ID"]
          branch = os.environ["VERCEL_GIT_BRANCH"]
          commit_sha = os.environ["VERCEL_GIT_COMMIT_SHA"]

          params = urllib.parse.urlencode(
              {
                  "projectId": project_id,
                  "teamId": team_id,
                  "limit": 20,
                  "target": "preview",
                  "branch": branch,
              }
          )
          url = f"https://api.vercel.com/v6/deployments?{params}"
          headers = {"Authorization": f"Bearer {token}"}

          def deployment_commit_sha(deployment):
              meta = deployment.get("meta") or {}
              git_source = deployment.get("gitSource") or {}
              candidates = [
                  meta.get("githubCommitSha"),
                  meta.get("githubCommitSHA"),
                  meta.get("gitCommitSha"),
                  git_source.get("sha"),
              ]
              for candidate in candidates:
                  if candidate:
                      return candidate
              return None

          for _ in range(18):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)
              deployments = payload.get("deployments", [])
              for deployment in deployments:
                  if deployment_commit_sha(deployment) == commit_sha:
                      print(json.dumps(deployment))
                      raise SystemExit(0)
              time.sleep(10)
          raise SystemExit(
              "No Vercel preview deployment found yet for "
              f"branch {branch!r} at commit {commit_sha!r}"
          )
          PY
          )"
          deployment_id="$(printf '%s' "$deployment_json" | python -c 'import json,sys; print(json.load(sys.stdin)["uid"])')"
          project_name="$(printf '%s' "$deployment_json" | python -c 'import json,sys; print(json.load(sys.stdin)["name"])')"
          redeploy_json="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID&forceNew=1" \
            -d "{\"name\":\"$project_name\",\"deploymentId\":\"$deployment_id\"}")"
          preview_url="$(printf '%s' "$redeploy_json" | python -c 'import json,sys; print("https://" + json.load(sys.stdin)["url"])')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Summarize preview URLs
        if: ${{ always() }}
        run: |
          {
            echo "## Preview deployment"
            echo
            if [ -n "${{ steps.deploy_modal.outputs.modal_api_url }}" ]; then
              echo "- Modal API: ${{ steps.deploy_modal.outputs.modal_api_url }} (redeployed)"
            else
              echo "- Modal API: not redeployed this push (no backend changes since last successful deploy)"
            fi
            if [ -n "${{ steps.redeploy_vercel.outputs.preview_url }}" ]; then
              echo "- Vercel preview: ${{ steps.redeploy_vercel.outputs.preview_url }} (force-redeployed)"
            else
              echo "- Vercel preview: handled by Vercel's git integration"
            fi
            if [ -n "${{ steps.supabase_branch.outputs.branch_ref }}" ]; then
              echo "- Supabase branch: \`${{ steps.supabase_branch.outputs.branch_ref }}\` (host: ${{ steps.supabase_branch.outputs.db_host }})"
            fi
            echo "- PR head SHA: ${{ github.event.pull_request.head.sha }}"
            echo "- Plan: deploy_backend=\`${{ needs.detect-changes.outputs.deploy_backend }}\` run_migrations=\`${{ needs.detect-changes.outputs.run_migrations }}\` branch_was_created=\`${{ steps.supabase_branch.outputs.branch_was_created }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  stop-preview:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: preview
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_GIT_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Modal
        run: python -m pip install modal

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Stop preview backend
        continue-on-error: true
        run: modal app stop oddish-pr-${{ github.event.pull_request.number }}

      - name: Delete per-PR Modal database secret
        continue-on-error: true
        run: modal secret delete --env "$MODAL_ENVIRONMENT" oddish-pr-${{ github.event.pull_request.number }}-db

      - name: Delete Supabase preview branch
        continue-on-error: true
        env:
          BRANCH_NAME: pr-${{ github.event.pull_request.number }}
        run: |
          ids=$(supabase branches list --project-ref "$SUPABASE_PROJECT_REF" -o json \
            | jq -r --arg name "$BRANCH_NAME" '
                .[] | select(.persistent != true)
                    | select(.name == $name)
                    | .id')
          for id in $ids; do
            echo "deleting Supabase branch $id"
            supabase branches delete "$id" --project-ref "$SUPABASE_PROJECT_REF" || true
          done

      - name: Install Node
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: npm install --global vercel@latest

      - name: Link Vercel project
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        run: vercel pull --yes --environment=preview --git-branch="$VERCEL_GIT_BRANCH" --token="$VERCEL_TOKEN"

      - name: Remove Vercel preview overrides
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        run: vercel env rm NEXT_PUBLIC_API_URL preview "$VERCEL_GIT_BRANCH" --yes --token="$VERCEL_TOKEN" || true
