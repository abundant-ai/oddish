name: Modal Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  # Shared preview environment with one Modal app per PR.
  group: modal-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: preview
      MODAL_APP_NAME: oddish-pr-${{ github.event.pull_request.number }}
      MODAL_SECRET_ENVIRONMENT: main
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_GIT_BRANCH: ${{ github.event.pull_request.head.ref }}
      VERCEL_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      ODDISH_ENABLE_MODAL_WORKERS: "0"
      ODDISH_MODAL_API_MIN_CONTAINERS: "0"
      ODDISH_MODAL_API_BUFFER_CONTAINERS: "0"
      ODDISH_MODAL_API_MAX_CONTAINERS: "2"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Wait for Supabase preview branch
        id: supabase_branch
        working-directory: ${{ github.workspace }}
        env:
          GIT_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${SUPABASE_PROJECT_REF}" ]; then
            echo "SUPABASE_ACCESS_TOKEN secret and SUPABASE_PROJECT_REF variable must be configured" >&2
            exit 1
          fi
          python .github/scripts/preview/wait_for_supabase_branch.py

      - name: Sync oddish dependencies
        working-directory: oddish
        # `alembic` lives in the `server` optional-dependency extra, not in
        # the default deps; the extra has to be requested explicitly.
        run: uv sync --frozen --extra server

      - name: Bootstrap oddish core schema on the preview branch
        working-directory: oddish
        # oddish's baseline migration is a no-op; the core tables (tasks,
        # trials, experiments, etc.) are created from `Base.metadata` via
        # `init_db()`. Production was bootstrapped once long ago; preview
        # branches start empty so we have to run it here before stamping.
        run: uv run python -c "import asyncio; from oddish.db import init_db; asyncio.run(init_db())"

      - name: Stamp oddish migrations as applied
        working-directory: oddish
        # Schema now matches the head of the model definitions, which
        # equals the head of the migration chain. Stamping (rather than
        # upgrading) skips re-applying ALTERs that would target already-
        # current columns.
        run: uv run alembic stamp head

      - name: Sync backend dependencies
        run: uv sync --frozen

      - name: Bootstrap backend cloud schema on the preview branch
        # Backend migrations also assume an evolving oddish baseline
        # (e.g. e2f3a4b5c6d7 backfills `experiments.org_id` from
        # `tasks.experiment_id`, a column oddish later replaced with a
        # task_experiments M2M table). Materialize the cloud-auth tables
        # via Base.metadata.create_all and stamp the chain at head.
        # backend.models registers organizations / users / api_keys on
        # the shared Base; `init_db()` then creates both oddish and
        # backend tables (oddish ones are already present from the
        # earlier step, so the IF NOT EXISTS path is taken).
        run: |
          uv run python - <<'PY'
          import asyncio
          import models  # noqa: F401  # register cloud-auth tables on Base.metadata (flat layout, imported as `models`)
          from oddish.db import init_db
          asyncio.run(init_db())
          PY

      - name: Stamp backend migrations as applied
        run: uv run alembic stamp head

      - name: Create per-PR Modal database secret
        # Named secret consumed by `backend/modal_app.py`. Must exist *before*
        # `modal deploy` resolves the app's secret list, otherwise the
        # preview app's container fails on cold start with a
        # "secret not found" error. `--force` makes this idempotent across
        # synchronize events on the same PR.
        run: |
          uv run modal secret create \
            --env "$MODAL_ENVIRONMENT" \
            --force \
            "$MODAL_APP_NAME-db" \
            "ODDISH_DATABASE_URL=$ODDISH_DATABASE_URL"

      - name: Deploy preview backend
        id: deploy_modal
        run: |
          deploy_log="$(mktemp)"
          uv run modal deploy deploy.py 2>&1 | tee "$deploy_log"
          modal_api_url="$(python - "$deploy_log" "$MODAL_APP_NAME" <<'PY'
          import pathlib
          import re
          import sys

          log_path = pathlib.Path(sys.argv[1])
          app_name = sys.argv[2]
          text = log_path.read_text()

          candidates = []
          for line in text.splitlines():
              if "modal.run" not in line:
                  continue
              if "api" not in line.lower():
                  continue
              match = re.search(r"https://[^\s]+\.modal\.run", line)
              if match:
                  candidates.append(match.group(0))

          if not candidates:
              raise SystemExit(
                  f"Could not determine Modal API URL for {app_name} from deploy output"
              )
          print(candidates[-1])
          PY
          )"
          echo "modal_api_url=$modal_api_url" >> "$GITHUB_OUTPUT"

      - name: Wait for preview backend readiness
        id: readiness
        run: |
          python - "${{ steps.deploy_modal.outputs.modal_api_url }}" <<'PY'
          import sys
          import time
          import urllib.error
          import urllib.request

          base_url = sys.argv[1].rstrip("/")
          readiness_url = f"{base_url}/openapi.json"
          deadline = time.time() + 180
          last_error = "no readiness response yet"

          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(readiness_url, timeout=10) as response:
                      payload = response.read(64)
                  if response.status == 200 and payload:
                      print(f"Modal preview ready at {readiness_url}")
                      break
                  last_error = f"unexpected response: {payload!r}"
              except urllib.error.HTTPError as exc:
                  last_error = f"http {exc.code}"
              except Exception as exc:  # noqa: BLE001
                  last_error = str(exc)
              time.sleep(5)
          else:
              raise SystemExit(
                  f"Modal preview never became ready at {readiness_url}: {last_error}"
              )
          PY

      - name: Dump Modal preview logs on readiness failure
        if: ${{ failure() && steps.readiness.conclusion == 'failure' }}
        continue-on-error: true
        run: |
          echo "::group::modal app logs $MODAL_APP_NAME (env=$MODAL_ENVIRONMENT)"
          # `modal app logs` streams indefinitely with no flag to disable; let
          # it run for 45s (long enough to flush startup logs) and then SIGTERM.
          # `--env` is required because the CLI does not honor MODAL_ENVIRONMENT
          # for this subcommand the way `modal deploy` does.
          timeout --preserve-status 45s uv run modal app logs --env "$MODAL_ENVIRONMENT" --timestamps "$MODAL_APP_NAME" 2>&1 | tail -300 || true
          echo "::endgroup::"

      - name: Install Node
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: npm install --global vercel@latest

      - name: Link Vercel project
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        run: vercel pull --yes --environment=preview --git-branch="$VERCEL_GIT_BRANCH" --token="$VERCEL_TOKEN"

      - name: Point Vercel preview to Modal preview
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        env:
          MODAL_API_URL: ${{ steps.deploy_modal.outputs.modal_api_url }}
        run: |
          # `NEXT_PUBLIC_API_URL` is the *only* backend URL the frontend
          # reads (frontend/src/lib/backend-config.ts). The other
          # NEXT_PUBLIC_MODAL_* / NEXT_PUBLIC_BACKEND_TYPE vars are dead
          # code from an older revision; we still `rm || true` them so
          # any stale per-branch overrides don't bleed into the build.
          # `--no-sensitive` keeps the value visible in the Vercel
          # dashboard for debugging (the CLI default is sensitive,
          # which makes the value unreadable after creation).
          printf '%s' "$MODAL_API_URL" | vercel env add NEXT_PUBLIC_API_URL preview "$VERCEL_GIT_BRANCH" --force --no-sensitive --token="$VERCEL_TOKEN"
          vercel env rm NEXT_PUBLIC_BACKEND_TYPE preview "$VERCEL_GIT_BRANCH" --yes --token="$VERCEL_TOKEN" || true
          vercel env rm NEXT_PUBLIC_MODAL_API_URL preview "$VERCEL_GIT_BRANCH" --yes --token="$VERCEL_TOKEN" || true
          vercel env rm NEXT_PUBLIC_MODAL_BASE_URL preview "$VERCEL_GIT_BRANCH" --yes --token="$VERCEL_TOKEN" || true
          vercel env rm NEXT_PUBLIC_MODAL_ENV preview "$VERCEL_GIT_BRANCH" --yes --token="$VERCEL_TOKEN" || true

      - name: Redeploy Vercel preview with updated env
        id: redeploy_vercel
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        run: |
          deployment_json="$(python <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          token = os.environ["VERCEL_TOKEN"]
          project_id = os.environ["VERCEL_PROJECT_ID"]
          team_id = os.environ["VERCEL_ORG_ID"]
          branch = os.environ["VERCEL_GIT_BRANCH"]
          commit_sha = os.environ["VERCEL_GIT_COMMIT_SHA"]

          params = urllib.parse.urlencode(
              {
                  "projectId": project_id,
                  "teamId": team_id,
                  "limit": 20,
                  "target": "preview",
                  "branch": branch,
              }
          )
          url = f"https://api.vercel.com/v6/deployments?{params}"
          headers = {"Authorization": f"Bearer {token}"}

          def deployment_commit_sha(deployment):
              meta = deployment.get("meta") or {}
              git_source = deployment.get("gitSource") or {}
              candidates = [
                  meta.get("githubCommitSha"),
                  meta.get("githubCommitSHA"),
                  meta.get("gitCommitSha"),
                  git_source.get("sha"),
              ]
              for candidate in candidates:
                  if candidate:
                      return candidate
              return None

          for _ in range(18):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)
              deployments = payload.get("deployments", [])
              for deployment in deployments:
                  if deployment_commit_sha(deployment) == commit_sha:
                      print(json.dumps(deployment))
                      raise SystemExit(0)
              time.sleep(10)
          raise SystemExit(
              "No Vercel preview deployment found yet for "
              f"branch {branch!r} at commit {commit_sha!r}"
          )
          PY
          )"
          deployment_id="$(printf '%s' "$deployment_json" | python -c 'import json,sys; print(json.load(sys.stdin)["uid"])')"
          project_name="$(printf '%s' "$deployment_json" | python -c 'import json,sys; print(json.load(sys.stdin)["name"])')"
          redeploy_json="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID&forceNew=1" \
            -d "{\"name\":\"$project_name\",\"deploymentId\":\"$deployment_id\"}")"
          preview_url="$(printf '%s' "$redeploy_json" | python -c 'import json,sys; print("https://" + json.load(sys.stdin)["url"])')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Summarize preview URLs
        if: ${{ always() }}
        run: |
          {
            echo "## Preview deployment"
            echo
            echo "- Modal API: ${{ steps.deploy_modal.outputs.modal_api_url }}"
            if [ -n "${{ steps.redeploy_vercel.outputs.preview_url }}" ]; then
              echo "- Vercel preview: ${{ steps.redeploy_vercel.outputs.preview_url }}"
            fi
            if [ -n "${{ steps.supabase_branch.outputs.branch_ref }}" ]; then
              echo "- Supabase branch: \`${{ steps.supabase_branch.outputs.branch_ref }}\` (host: ${{ steps.supabase_branch.outputs.db_host }})"
            fi
            echo "- PR head SHA: ${{ github.event.pull_request.head.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

  stop-preview:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: preview
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_GIT_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Modal
        run: python -m pip install modal

      - name: Stop preview backend
        continue-on-error: true
        run: modal app stop oddish-pr-${{ github.event.pull_request.number }}

      - name: Delete per-PR Modal database secret
        continue-on-error: true
        run: modal secret delete --env "$MODAL_ENVIRONMENT" oddish-pr-${{ github.event.pull_request.number }}-db

      - name: Install Node
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: npm install --global vercel@latest

      - name: Link Vercel project
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        run: vercel pull --yes --environment=preview --git-branch="$VERCEL_GIT_BRANCH" --token="$VERCEL_TOKEN"

      - name: Remove Vercel preview overrides
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        run: |
          vercel env rm NEXT_PUBLIC_API_URL preview "$VERCEL_GIT_BRANCH" --yes --token="$VERCEL_TOKEN" || true
          vercel env rm NEXT_PUBLIC_BACKEND_TYPE preview "$VERCEL_GIT_BRANCH" --yes --token="$VERCEL_TOKEN" || true
          vercel env rm NEXT_PUBLIC_MODAL_API_URL preview "$VERCEL_GIT_BRANCH" --yes --token="$VERCEL_TOKEN" || true
          vercel env rm NEXT_PUBLIC_MODAL_BASE_URL preview "$VERCEL_GIT_BRANCH" --yes --token="$VERCEL_TOKEN" || true
          vercel env rm NEXT_PUBLIC_MODAL_ENV preview "$VERCEL_GIT_BRANCH" --yes --token="$VERCEL_TOKEN" || true
