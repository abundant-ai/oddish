name: Modal Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: modal-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Post-migration scope: this workflow only deploys *worker* containers
# to Modal. The HTTP API now lives at ``frontend/api/oddish.py`` and is
# served by the same Vercel preview as the Next.js frontend, so the
# old "deploy API to Modal -> wait for /openapi.json -> override
# NEXT_PUBLIC_API_URL on Vercel -> redeploy Vercel" dance is gone.
#
# The Vercel preview still needs the per-PR ``ODDISH_DATABASE_URL`` so
# its Python function hits the correct Supabase preview branch; that's
# what the "Point Vercel preview to preview DB" step does.

jobs:
  deploy-preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: preview
      MODAL_APP_NAME: oddish-pr-${{ github.event.pull_request.number }}
      MODAL_SECRET_ENVIRONMENT: main
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_GIT_BRANCH: ${{ github.event.pull_request.head.ref }}
      VERCEL_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      ODDISH_MODAL_WORKER_MIN_CONTAINERS: "0"
      ODDISH_MODAL_WORKER_BUFFER_CONTAINERS: "0"
      ODDISH_MODAL_WORKER_MAX_CONTAINERS: "2"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ensure Supabase preview branch with prod data
        id: supabase_branch
        working-directory: ${{ github.workspace }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/preview/wait_for_supabase_branch.sh

      - name: Sync backend dependencies
        run: uv sync --frozen

      - name: Apply Alembic migrations to preview branch
        run: uv run python "$GITHUB_WORKSPACE/.github/scripts/preview/bootstrap_preview_db.py"

      - name: Cancel cloned-prod in-flight work
        # Only on a fresh branch — once the dev has interacted with the
        # preview, their own pending work shouldn't get nuked on every
        # subsequent push.
        if: steps.supabase_branch.outputs.branch_was_created == 'true'
        run: |
          psql "${ODDISH_DATABASE_URL/+asyncpg/}" <<'SQL'
          UPDATE worker_jobs
             SET status = 'CANCELLED'
           WHERE status IN ('QUEUED', 'RUNNING', 'RETRYING', 'BLOCKED');
          UPDATE tasks
             SET status = 'failed'
           WHERE status IN ('pending', 'running', 'analyzing', 'verdict_pending');
          UPDATE trials
             SET status = 'failed'
           WHERE status IN ('pending', 'queued', 'running', 'retrying');
          SQL

      - name: Create per-PR Modal database secret
        # Workers running on Modal still need the per-PR DB URL so they
        # claim jobs from the preview Supabase branch, not prod.
        run: |
          uv run modal secret create \
            --env "$MODAL_ENVIRONMENT" --force \
            "$MODAL_APP_NAME-db" \
            "ODDISH_DATABASE_URL=$ODDISH_DATABASE_URL"

      - name: Deploy preview workers
        run: uv run modal deploy deploy.py

      - name: Install Node
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: npm install --global vercel@latest

      - name: Link Vercel project
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        run: vercel pull --yes --environment=preview --git-branch="$VERCEL_GIT_BRANCH" --token="$VERCEL_TOKEN"

      - name: Point Vercel preview to preview DB
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        # ``ODDISH_DATABASE_URL`` is the Supabase preview branch's
        # connection string. The Vercel Python function reads it at
        # request time via ``oddish.config.settings``. ``--sensitive``
        # because it embeds the DB password.
        run: printf '%s' "$ODDISH_DATABASE_URL" | vercel env add ODDISH_DATABASE_URL preview "$VERCEL_GIT_BRANCH" --force --sensitive --token="$VERCEL_TOKEN"

      - name: Redeploy Vercel preview with updated env
        id: redeploy_vercel
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        run: |
          deployment_json="$(python <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          token = os.environ["VERCEL_TOKEN"]
          project_id = os.environ["VERCEL_PROJECT_ID"]
          team_id = os.environ["VERCEL_ORG_ID"]
          branch = os.environ["VERCEL_GIT_BRANCH"]
          commit_sha = os.environ["VERCEL_GIT_COMMIT_SHA"]

          params = urllib.parse.urlencode(
              {
                  "projectId": project_id,
                  "teamId": team_id,
                  "limit": 20,
                  "target": "preview",
                  "branch": branch,
              }
          )
          url = f"https://api.vercel.com/v6/deployments?{params}"
          headers = {"Authorization": f"Bearer {token}"}

          def deployment_commit_sha(deployment):
              meta = deployment.get("meta") or {}
              git_source = deployment.get("gitSource") or {}
              candidates = [
                  meta.get("githubCommitSha"),
                  meta.get("githubCommitSHA"),
                  meta.get("gitCommitSha"),
                  git_source.get("sha"),
              ]
              for candidate in candidates:
                  if candidate:
                      return candidate
              return None

          for _ in range(18):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)
              deployments = payload.get("deployments", [])
              for deployment in deployments:
                  if deployment_commit_sha(deployment) == commit_sha:
                      print(json.dumps(deployment))
                      raise SystemExit(0)
              time.sleep(10)
          raise SystemExit(
              "No Vercel preview deployment found yet for "
              f"branch {branch!r} at commit {commit_sha!r}"
          )
          PY
          )"
          deployment_id="$(printf '%s' "$deployment_json" | python -c 'import json,sys; print(json.load(sys.stdin)["uid"])')"
          project_name="$(printf '%s' "$deployment_json" | python -c 'import json,sys; print(json.load(sys.stdin)["name"])')"
          redeploy_json="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID&forceNew=1" \
            -d "{\"name\":\"$project_name\",\"deploymentId\":\"$deployment_id\"}")"
          preview_url="$(printf '%s' "$redeploy_json" | python -c 'import json,sys; print("https://" + json.load(sys.stdin)["url"])')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Summarize preview URLs
        if: ${{ always() }}
        run: |
          {
            echo "## Preview deployment"
            echo
            echo "- Modal workers: \`$MODAL_APP_NAME\` (env: \`$MODAL_ENVIRONMENT\`)"
            if [ -n "${{ steps.redeploy_vercel.outputs.preview_url }}" ]; then
              echo "- Vercel preview (frontend + API): ${{ steps.redeploy_vercel.outputs.preview_url }}"
            fi
            if [ -n "${{ steps.supabase_branch.outputs.branch_ref }}" ]; then
              echo "- Supabase branch: \`${{ steps.supabase_branch.outputs.branch_ref }}\` (host: ${{ steps.supabase_branch.outputs.db_host }})"
            fi
            echo "- PR head SHA: ${{ github.event.pull_request.head.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

  stop-preview:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: preview
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_GIT_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Modal
        run: python -m pip install modal

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Stop preview backend
        continue-on-error: true
        run: modal app stop oddish-pr-${{ github.event.pull_request.number }}

      - name: Delete per-PR Modal database secret
        continue-on-error: true
        run: modal secret delete --env "$MODAL_ENVIRONMENT" oddish-pr-${{ github.event.pull_request.number }}-db

      - name: Delete Supabase preview branch
        continue-on-error: true
        env:
          BRANCH_NAME: pr-${{ github.event.pull_request.number }}
        run: |
          ids=$(supabase branches list --project-ref "$SUPABASE_PROJECT_REF" -o json \
            | jq -r --arg name "$BRANCH_NAME" '
                .[] | select(.persistent != true)
                    | select(.name == $name)
                    | .id')
          for id in $ids; do
            echo "deleting Supabase branch $id"
            supabase branches delete "$id" --project-ref "$SUPABASE_PROJECT_REF" || true
          done

      - name: Install Node
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: npm install --global vercel@latest

      - name: Link Vercel project
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        run: vercel pull --yes --environment=preview --git-branch="$VERCEL_GIT_BRANCH" --token="$VERCEL_TOKEN"

      - name: Remove Vercel preview overrides
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        run: vercel env rm ODDISH_DATABASE_URL preview "$VERCEL_GIT_BRANCH" --yes --token="$VERCEL_TOKEN" || true
