name: Modal Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: modal-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      db: ${{ steps.f.outputs.db }}
      backend: ${{ steps.f.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            db: ['backend/alembic/**', 'oddish/alembic/**', 'supabase/migrations/**', 'supabase/config.toml']
            backend: ['backend/**', 'oddish/**', 'supabase/**', '.github/workflows/modal-preview.yml', '.github/scripts/preview/**']

  deploy-preview:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: preview
      MODAL_APP_NAME: oddish-pr-${{ github.event.pull_request.number }}
      MODAL_SECRET_ENVIRONMENT: main
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_GIT_BRANCH: ${{ github.event.pull_request.head.ref }}
      VERCEL_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      DB_CHANGED: ${{ needs.changes.outputs.db }}
      BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
      PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      PROD_API_URL: ${{ vars.PROD_API_URL }}
      ODDISH_MODAL_API_MIN_CONTAINERS: "0"
      ODDISH_MODAL_API_BUFFER_CONTAINERS: "0"
      ODDISH_MODAL_API_MAX_CONTAINERS: "2"
      ODDISH_MODAL_WORKER_MIN_CONTAINERS: "0"
      ODDISH_MODAL_WORKER_BUFFER_CONTAINERS: "0"
      ODDISH_MODAL_WORKER_MAX_CONTAINERS: "2"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - if: env.BACKEND_CHANGED == 'true'
        uses: astral-sh/setup-uv@v4

      - if: env.DB_CHANGED == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Wait for Supabase preview branch
        id: supabase_branch
        if: env.DB_CHANGED == 'true'
        working-directory: ${{ github.workspace }}
        env:
          GIT_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/preview/wait_for_supabase_branch.sh

      - name: Use production database (no schema changes in PR)
        if: env.BACKEND_CHANGED == 'true' && env.DB_CHANGED != 'true'
        run: |
          [ -n "$PROD_DATABASE_URL" ] || { echo "::error::secrets.PROD_DATABASE_URL required when no DB changes are in the PR"; exit 1; }
          echo "ODDISH_DATABASE_URL=$PROD_DATABASE_URL" >> "$GITHUB_ENV"

      - if: env.BACKEND_CHANGED == 'true'
        run: uv sync --frozen

      - name: Bootstrap preview database
        if: env.DB_CHANGED == 'true'
        run: uv run python "$GITHUB_WORKSPACE/.github/scripts/preview/bootstrap_preview_db.py"

      - name: Deploy preview backend
        id: deploy_modal
        if: env.BACKEND_CHANGED == 'true'
        run: |
          uv run modal secret create --env "$MODAL_ENVIRONMENT" --force \
            "$MODAL_APP_NAME-db" "ODDISH_DATABASE_URL=$ODDISH_DATABASE_URL"
          deploy_log="$(mktemp)"
          uv run modal deploy deploy.py 2>&1 | tee "$deploy_log"
          modal_api_url="$(python - "$deploy_log" <<'PY'
          import pathlib, re, sys
          urls = [m.group(0) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()
                  if "modal.run" in line and "api" in line.lower()
                  for m in [re.search(r"https://[^\s]+\.modal\.run", line)] if m]
          if not urls: raise SystemExit("Could not determine Modal API URL")
          print(urls[-1])
          PY
          )"
          echo "modal_api_url=$modal_api_url" >> "$GITHUB_OUTPUT"

      - name: Wait for preview backend readiness
        id: readiness
        if: env.BACKEND_CHANGED == 'true'
        run: |
          python - "${{ steps.deploy_modal.outputs.modal_api_url }}" <<'PY'
          import sys, time, urllib.request
          url = sys.argv[1].rstrip("/") + "/openapi.json"
          deadline, err = time.time() + 180, "no response"
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=10) as r:
                      if r.status == 200 and r.read(64): print(f"ready: {url}"); sys.exit(0)
              except Exception as e: err = str(e)
              time.sleep(5)
          raise SystemExit(f"Modal preview never ready at {url}: {err}")
          PY

      - name: Dump Modal preview logs on readiness failure
        if: ${{ failure() && steps.readiness.conclusion == 'failure' }}
        continue-on-error: true
        # `modal app logs` streams forever; bound it. `--env` is needed
        # because the CLI ignores MODAL_ENVIRONMENT for this subcommand.
        run: timeout --preserve-status 45s uv run modal app logs --env "$MODAL_ENVIRONMENT" --timestamps "$MODAL_APP_NAME" 2>&1 | tail -300 || true

      # Backend untouched in this PR — tear down any per-PR Modal app left
      # over from an earlier push so the Vercel preview can't point at a
      # dead URL, and below we route Vercel back to prod.
      - name: Tear down stale per-PR Modal app
        if: env.BACKEND_CHANGED != 'true'
        continue-on-error: true
        run: |
          python -m pip install --quiet modal
          modal app stop "$MODAL_APP_NAME" || true
          modal secret delete --env "$MODAL_ENVIRONMENT" "$MODAL_APP_NAME-db" || true

      - name: Resolve Vercel API target (preview vs prod)
        id: api_url
        run: |
          if [ "$BACKEND_CHANGED" = "true" ]; then
            echo "url=${{ steps.deploy_modal.outputs.modal_api_url }}" >> "$GITHUB_OUTPUT"
          else
            [ -n "$PROD_API_URL" ] || { echo "::error::vars.PROD_API_URL required when no backend changes are in the PR"; exit 1; }
            echo "url=$PROD_API_URL" >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: npm install --global vercel@latest

      - if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        run: vercel pull --yes --environment=preview --git-branch="$VERCEL_GIT_BRANCH" --token="$VERCEL_TOKEN"

      - name: Set Vercel preview NEXT_PUBLIC_API_URL
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        env:
          API_URL: ${{ steps.api_url.outputs.url }}
        # NEXT_PUBLIC_API_URL is the only backend URL the frontend reads
        # (frontend/src/lib/backend-config.ts). Always rewrite so we can't
        # ship a frontend pointing at a stopped Modal app from a prior push.
        run: |
          vercel env rm NEXT_PUBLIC_API_URL preview "$VERCEL_GIT_BRANCH" --yes --token="$VERCEL_TOKEN" || true
          printf '%s' "$API_URL" | vercel env add NEXT_PUBLIC_API_URL preview "$VERCEL_GIT_BRANCH" --force --no-sensitive --token="$VERCEL_TOKEN"

      - name: Redeploy Vercel preview with updated env
        id: redeploy_vercel
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        run: |
          deployment_json="$(python <<'PY'
          import json, os, time, urllib.parse, urllib.request
          token, project_id, team_id = os.environ["VERCEL_TOKEN"], os.environ["VERCEL_PROJECT_ID"], os.environ["VERCEL_ORG_ID"]
          branch, sha = os.environ["VERCEL_GIT_BRANCH"], os.environ["VERCEL_GIT_COMMIT_SHA"]
          params = urllib.parse.urlencode({"projectId": project_id, "teamId": team_id, "limit": 20, "target": "preview", "branch": branch})
          url = f"https://api.vercel.com/v6/deployments?{params}"
          headers = {"Authorization": f"Bearer {token}"}
          def commit_of(d):
              meta, gs = d.get("meta") or {}, d.get("gitSource") or {}
              for k in (meta.get("githubCommitSha"), meta.get("githubCommitSHA"), meta.get("gitCommitSha"), gs.get("sha")):
                  if k: return k
          for _ in range(18):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as r:
                  for d in json.load(r).get("deployments", []):
                      if commit_of(d) == sha: print(json.dumps(d)); raise SystemExit(0)
              time.sleep(10)
          raise SystemExit(f"No Vercel preview deployment for branch {branch!r} at commit {sha!r}")
          PY
          )"
          deployment_id="$(printf '%s' "$deployment_json" | python -c 'import json,sys; print(json.load(sys.stdin)["uid"])')"
          project_name="$(printf '%s' "$deployment_json" | python -c 'import json,sys; print(json.load(sys.stdin)["name"])')"
          redeploy_json="$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID&forceNew=1" \
            -d "{\"name\":\"$project_name\",\"deploymentId\":\"$deployment_id\"}")"
          preview_url="$(printf '%s' "$redeploy_json" | python -c 'import json,sys; print("https://" + json.load(sys.stdin)["url"])')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Summarize preview URLs
        if: ${{ always() }}
        run: |
          {
            echo "## Preview deployment"
            echo
            echo "- Vercel API target: ${{ steps.api_url.outputs.url }} ($([ "$BACKEND_CHANGED" = "true" ] && echo "per-PR Modal" || echo "prod"))"
            if [ -n "${{ steps.redeploy_vercel.outputs.preview_url }}" ]; then echo "- Vercel preview: ${{ steps.redeploy_vercel.outputs.preview_url }}"; fi
            if [ "$DB_CHANGED" = "true" ]; then
              echo "- Supabase branch: \`${{ steps.supabase_branch.outputs.branch_ref }}\`"
            else
              echo "- Database: production (no schema changes in PR)"
            fi
            echo "- PR head SHA: ${{ github.event.pull_request.head.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

  stop-preview:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: preview
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_GIT_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: python -m pip install modal

      - continue-on-error: true
        run: modal app stop oddish-pr-${{ github.event.pull_request.number }}

      - continue-on-error: true
        run: modal secret delete --env "$MODAL_ENVIRONMENT" oddish-pr-${{ github.event.pull_request.number }}-db

      - if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: npm install --global vercel@latest

      - if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        run: vercel pull --yes --environment=preview --git-branch="$VERCEL_GIT_BRANCH" --token="$VERCEL_TOKEN"

      - if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        run: vercel env rm NEXT_PUBLIC_API_URL preview "$VERCEL_GIT_BRANCH" --yes --token="$VERCEL_TOKEN" || true
