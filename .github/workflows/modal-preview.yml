name: Modal Preview

# Previews are on-demand. Comment `/preview` on a PR (or run via
# workflow_dispatch with the PR number) to spin up a per-PR Supabase
# branch + Modal app and re-point the Vercel preview at it. The PR's
# default Vercel preview otherwise just uses the project-wide prod
# `NEXT_PUBLIC_API_URL`.
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to preview
        required: true

concurrency:
  group: modal-preview-${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  preflight:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && startsWith(github.event.comment.body, '/preview')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
    steps:
      - uses: actions/github-script@v7
        id: pr
        with:
          script: |
            const num = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.pr_number)
              : context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: num,
            });
            core.setOutput('pr_number', num);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_repo', pr.head.repo.full_name);
            if (context.eventName === 'issue_comment') {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: context.payload.comment.id, content: 'eyes',
              });
            }

  deploy-preview:
    needs: preflight
    if: needs.preflight.outputs.head_repo == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: preview
      MODAL_APP_NAME: oddish-pr-${{ needs.preflight.outputs.pr_number }}
      MODAL_SECRET_ENVIRONMENT: main
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_GIT_BRANCH: ${{ needs.preflight.outputs.head_ref }}
      VERCEL_GIT_COMMIT_SHA: ${{ needs.preflight.outputs.head_sha }}
      ODDISH_MODAL_API_MIN_CONTAINERS: "0"
      ODDISH_MODAL_API_BUFFER_CONTAINERS: "0"
      ODDISH_MODAL_API_MAX_CONTAINERS: "2"
      ODDISH_MODAL_WORKER_MIN_CONTAINERS: "0"
      ODDISH_MODAL_WORKER_BUFFER_CONTAINERS: "0"
      ODDISH_MODAL_WORKER_MAX_CONTAINERS: "2"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Wait for Supabase preview branch
        id: supabase_branch
        working-directory: ${{ github.workspace }}
        env:
          GIT_BRANCH: ${{ needs.preflight.outputs.head_ref }}
          PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
        run: .github/scripts/preview/wait_for_supabase_branch.sh

      - run: uv sync --frozen

      - run: uv run python "$GITHUB_WORKSPACE/.github/scripts/preview/bootstrap_preview_db.py"

      - name: Deploy preview backend
        id: deploy_modal
        run: |
          uv run modal secret create --env "$MODAL_ENVIRONMENT" --force \
            "$MODAL_APP_NAME-db" "ODDISH_DATABASE_URL=$ODDISH_DATABASE_URL"
          deploy_log="$(mktemp)"
          uv run modal deploy deploy.py 2>&1 | tee "$deploy_log"
          modal_api_url="$(python - "$deploy_log" <<'PY'
          import pathlib, re, sys
          urls = [m.group(0) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()
                  if "modal.run" in line and "api" in line.lower()
                  for m in [re.search(r"https://[^\s]+\.modal\.run", line)] if m]
          if not urls: raise SystemExit("Could not determine Modal API URL")
          print(urls[-1])
          PY
          )"
          echo "modal_api_url=$modal_api_url" >> "$GITHUB_OUTPUT"

      - name: Wait for preview backend readiness
        id: readiness
        run: |
          python - "${{ steps.deploy_modal.outputs.modal_api_url }}" <<'PY'
          import sys, time, urllib.request
          url = sys.argv[1].rstrip("/") + "/openapi.json"
          deadline, err = time.time() + 180, "no response"
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=10) as r:
                      if r.status == 200 and r.read(64): print(f"ready: {url}"); sys.exit(0)
              except Exception as e: err = str(e)
              time.sleep(5)
          raise SystemExit(f"Modal preview never ready at {url}: {err}")
          PY

      - if: ${{ failure() && steps.readiness.conclusion == 'failure' }}
        continue-on-error: true
        # `modal app logs` streams forever; bound it. `--env` is needed
        # because the CLI ignores MODAL_ENVIRONMENT for this subcommand.
        run: timeout --preserve-status 45s uv run modal app logs --env "$MODAL_ENVIRONMENT" --timestamps "$MODAL_APP_NAME" 2>&1 | tail -300 || true

      - if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: npm install --global vercel@latest

      - if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        run: vercel pull --yes --environment=preview --git-branch="$VERCEL_GIT_BRANCH" --token="$VERCEL_TOKEN"

      - name: Point Vercel preview at Modal preview
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        env:
          MODAL_API_URL: ${{ steps.deploy_modal.outputs.modal_api_url }}
        run: |
          vercel env rm NEXT_PUBLIC_API_URL preview "$VERCEL_GIT_BRANCH" --yes --token="$VERCEL_TOKEN" || true
          printf '%s' "$MODAL_API_URL" | vercel env add NEXT_PUBLIC_API_URL preview "$VERCEL_GIT_BRANCH" --force --no-sensitive --token="$VERCEL_TOKEN"

      - name: Redeploy Vercel preview with updated env
        id: redeploy_vercel
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        run: |
          deployment_json="$(python <<'PY'
          import json, os, time, urllib.parse, urllib.request
          token, project_id, team_id = os.environ["VERCEL_TOKEN"], os.environ["VERCEL_PROJECT_ID"], os.environ["VERCEL_ORG_ID"]
          branch, sha = os.environ["VERCEL_GIT_BRANCH"], os.environ["VERCEL_GIT_COMMIT_SHA"]
          params = urllib.parse.urlencode({"projectId": project_id, "teamId": team_id, "limit": 20, "target": "preview", "branch": branch})
          url = f"https://api.vercel.com/v6/deployments?{params}"
          headers = {"Authorization": f"Bearer {token}"}
          def commit_of(d):
              meta, gs = d.get("meta") or {}, d.get("gitSource") or {}
              for k in (meta.get("githubCommitSha"), meta.get("githubCommitSHA"), meta.get("gitCommitSha"), gs.get("sha")):
                  if k: return k
          for _ in range(18):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as r:
                  for d in json.load(r).get("deployments", []):
                      if commit_of(d) == sha: print(json.dumps(d)); raise SystemExit(0)
              time.sleep(10)
          raise SystemExit(f"No Vercel preview deployment for branch {branch!r} at commit {sha!r}")
          PY
          )"
          deployment_id="$(printf '%s' "$deployment_json" | python -c 'import json,sys; print(json.load(sys.stdin)["uid"])')"
          project_name="$(printf '%s' "$deployment_json" | python -c 'import json,sys; print(json.load(sys.stdin)["name"])')"
          redeploy_json="$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID&forceNew=1" \
            -d "{\"name\":\"$project_name\",\"deploymentId\":\"$deployment_id\"}")"
          preview_url="$(printf '%s' "$redeploy_json" | python -c 'import json,sys; print("https://" + json.load(sys.stdin)["url"])')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URLs on PR
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          MODAL_URL: ${{ steps.deploy_modal.outputs.modal_api_url }}
          VERCEL_URL: ${{ steps.redeploy_vercel.outputs.preview_url }}
          BRANCH_REF: ${{ steps.supabase_branch.outputs.branch_ref }}
          STATUS: ${{ job.status }}
        with:
          script: |
            const lines = [`**Preview** (${process.env.STATUS}) for ${context.sha.slice(0, 7)}:`];
            if (process.env.MODAL_URL) lines.push(`- Modal API: ${process.env.MODAL_URL}`);
            if (process.env.VERCEL_URL) lines.push(`- Vercel: ${process.env.VERCEL_URL}`);
            if (process.env.BRANCH_REF) lines.push(`- Supabase branch: \`${process.env.BRANCH_REF}\``);
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: ${{ needs.preflight.outputs.pr_number }},
              body: lines.join('\n'),
            });

  stop-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: preview
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_GIT_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: python -m pip install modal

      - continue-on-error: true
        run: modal app stop oddish-pr-${{ github.event.pull_request.number }}

      - continue-on-error: true
        run: modal secret delete --env "$MODAL_ENVIRONMENT" oddish-pr-${{ github.event.pull_request.number }}-db

      - if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: npm install --global vercel@latest

      - if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        run: vercel pull --yes --environment=preview --git-branch="$VERCEL_GIT_BRANCH" --token="$VERCEL_TOKEN"

      - if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        run: vercel env rm NEXT_PUBLIC_API_URL preview "$VERCEL_GIT_BRANCH" --yes --token="$VERCEL_TOKEN" || true
