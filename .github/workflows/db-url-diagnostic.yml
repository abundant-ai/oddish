name: DB URL Diagnostic

on:
  push:
    branches:
      - codex/db-url-diagnostic-*
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ODDISH_DATABASE_URL: ${{ secrets.ODDISH_DATABASE_URL }}
    steps:
      - name: Probe production database URL
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q asyncpg
          python - <<'PY'
          import asyncio
          import os
          import socket
          import sys
          from dataclasses import dataclass
          from urllib.parse import parse_qs, urlsplit, urlunsplit

          import asyncpg

          REF = "lmmlhiospelnvmtjljnn"

          @dataclass
          class Candidate:
              name: str
              host: str
              port: int
              user: str
              password: str
              database: str
              query: str = ""

              @property
              def redacted_url(self) -> str:
                  return urlunsplit(
                      (
                          "postgresql",
                          f"{self.user}:***@{self.host}:{self.port}",
                          f"/{self.database}",
                          self.query,
                          "",
                      )
                  )

          raw = os.environ.get("ODDISH_DATABASE_URL", "")
          if not raw:
              print("ODDISH_DATABASE_URL is empty")
              sys.exit(2)

          url = raw.replace("postgresql+asyncpg://", "postgresql://", 1)
          parts = urlsplit(url)
          secret_candidate = Candidate(
              name="configured_secret",
              host=parts.hostname or "",
              port=parts.port or 5432,
              user=parts.username or "",
              password=parts.password or "",
              database=parts.path.lstrip("/") or "postgres",
              query=parts.query,
          )
          candidates = [
              secret_candidate,
              Candidate(
                  name="direct_postgres",
                  host=f"db.{REF}.supabase.co",
                  port=5432,
                  user="postgres",
                  password=secret_candidate.password,
                  database="postgres",
                  query="sslmode=require",
              ),
          ]

          def print_dns(candidate: Candidate) -> bool:
              print("dns=")
              try:
                  infos = socket.getaddrinfo(
                      candidate.host, candidate.port, type=socket.SOCK_STREAM
                  )
              except Exception as exc:
                  print(f"  FAILED {type(exc).__name__}: {exc}")
                  return False
              for family, _socktype, _proto, _canonname, sockaddr in infos:
                  family_name = "IPv6" if family == socket.AF_INET6 else "IPv4"
                  print(f"  {family_name} {sockaddr[0]}:{sockaddr[1]}")
              return True

          def print_tcp(candidate: Candidate) -> bool:
              print("tcp=")
              try:
                  sock = socket.create_connection(
                      (candidate.host, candidate.port), timeout=12
                  )
              except Exception as exc:
                  print(f"  FAILED {type(exc).__name__}: {exc}")
                  return False
              else:
                  print("  OK")
                  sock.close()
                  return True

          async def probe(candidate: Candidate) -> bool:
              print()
              print(f"candidate={candidate.name}")
              print(f"url={candidate.redacted_url}")
              print(f"host={candidate.host}")
              print(f"port={candidate.port}")
              print(f"user={candidate.user}")
              print(f"database={candidate.database}")
              print_dns(candidate)
              print_tcp(candidate)

              sslmode = parse_qs(candidate.query).get("sslmode", [""])[0]
              ssl_arg = sslmode if sslmode else None
              try:
                  conn = await asyncpg.connect(
                      host=candidate.host,
                      port=candidate.port,
                      user=candidate.user,
                      password=candidate.password,
                      database=candidate.database,
                      ssl=ssl_arg,
                      timeout=15,
                      statement_cache_size=0,
                  )
              except Exception as exc:
                  msg = str(exc).replace(raw, candidate.redacted_url)
                  if candidate.password:
                      msg = msg.replace(candidate.password, "***")
                  print("connect=FAILED")
                  print(f"error_type={type(exc).__name__}")
                  print(f"error={msg}")
                  return False

              try:
                  row = await conn.fetchrow(
                      "select current_user as user_name, "
                      "current_database() as db_name, "
                      "inet_server_addr()::text as server_addr, "
                      "inet_server_port() as server_port"
                  )
                  print("connect=OK")
                  print(f"current_user={row['user_name']}")
                  print(f"current_database={row['db_name']}")
                  print(f"server_addr={row['server_addr']}")
                  print(f"server_port={row['server_port']}")
                  return True
              finally:
                  await conn.close()

          async def main() -> int:
              results = [await probe(candidate) for candidate in candidates]
              return 0 if any(results) else 1

          sys.exit(asyncio.run(main()))
          PY
