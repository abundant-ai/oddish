[project]
name = "crackbench"
version = "0.1.0"
description = "Auto-research harness for generating long-horizon, CrackMeBench-style cybersecurity tasks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Only needed for --live (real subagents over the Anthropic API).
live = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
crackbench = "crackbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crackbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
