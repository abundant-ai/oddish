schema_version = "1.1"

[task]
name = "skills/invoice-slack-reconciliation-mcp"
description = "ActionBench-style conversion: reconcile a multi-sheet invoice workbook against billing corrections that must be mined from a live Slack channel served over an MCP, then produce a ledger, customer summary, and correction audit."
authors = []
keywords = ["excel", "slack", "mcp", "tool-use", "billing", "invoices", "reconciliation", "json", "csv", "openpyxl", "actionbench"]

[metadata]
difficulty = "hard"
expert_time_estimate_hours = 6.0
category = "data-reconciliation"
tags = ["excel", "slack", "mcp", "tool-use", "resourcefulness", "billing", "invoices", "reconciliation", "actionbench", "skills"]
difficulty_explanation = "ActionBench-style conversion of the invoice-slack-reconciliation skills task. The hard domain logic is unchanged (sparse account owners, blank/subtotal rows, intra/inter-sheet duplicate invoice IDs, credit memos, customer aliases, multi-currency FX, partial payments, disputed/void invoices, aging buckets, reserve exposure, priority/timestamp correction conflicts, and additive payment events). What changes is the corrections SOURCE: instead of a static JSON export, the billing corrections live in a Slack channel exposed only through the `billing-slack` MCP. The agent must discover the channel, paginate the full history, open threads, and inspect attachments and blocks to recover every BILLING_FIX token (a single capped search is insufficient), making non-trivial tool use critical to the task rather than incidental."
solution_explanation = "The reference solution reads the workbook with openpyxl (fill-down owners, skip non-ledger rows, alias + FX normalization, credit-memo and dedup handling), gathers the corrections by paginating the billing-slack MCP channel and reading every thread, recursively extracts BILLING_FIX tokens from message text, attachments, blocks, and replies, resolves competing corrections by priority then timestamp, applies winning field-specific corrections including additive payment events, recomputes balances/aging/reserves, and writes the ledger CSV, customer summary JSON, and correction audit JSON. The provided oracle reads the same channel seed directly to produce the canonical outputs."
verification_explanation = "The verifier is reused verbatim from the source skills task and is unchanged by the conversion (the recoverable correction set is identical, so the expected outputs are identical). It runs pytest against the generated outputs: exact CSV columns, deduplicated row count, unique invoice IDs, account-owner fill-down, date and alias normalization, credit-memo links and negative balances, FX conversion, two-decimal money formatting, native and USD balance math, aging bucket and reserve math, seeded corrections including additive payment events, skipped-unknown and superseded audit entries, status-specific behavior, customer summary USD totals recomputed from the final ledger, and winning-patch timestamp ordering."

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true

[[environment.mcp_servers]]
name = "billing-slack"
transport = "stdio"
command = "/usr/local/bin/mock-slack-mcp"
args = ["/opt/slack-mcp/seed/billing_corrections_channel.json", "billing-slack"]

[verifier.env]

[environment.env]

[solution.env]
