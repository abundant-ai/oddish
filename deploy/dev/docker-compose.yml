# Per-worktree development data services. scripts/dev supplies the project name
# and host ports, so Compose volumes and listeners belong to exactly one cell.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oddish
      POSTGRES_PASSWORD: oddish
      POSTGRES_DB: oddish
    ports:
      - "127.0.0.1:${ODDISH_DEV_POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oddish -d oddish"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: oddish
      MINIO_ROOT_PASSWORD: oddish-local-development
    ports:
      - "127.0.0.1:${ODDISH_DEV_MINIO_PORT}:9000"
      - "127.0.0.1:${ODDISH_DEV_MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: oddish
      MINIO_ROOT_PASSWORD: oddish-local-development
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}"
        "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/oddish
    restart: "no"

volumes:
  postgres-data:
  minio-data:
